version: "3.9"

services:
  database:
    image: mariadb:${MARIADB_VERSION:-10.6.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMe!}
      MYSQL_DATABASE: ${MYSQL_DB:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "--host=database",
          "--user=${MYSQL_USER:-app}",
          "--password=${MYSQL_PASSWORD:-!ChangeMe!}",
        ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
    ports:
      - target: 3306
        published: 3306
        protocol: tcp
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-app}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
    ports:
      - target: 80
        published: ${PMA_PORT:-8080}
        protocol: tcp
    depends_on:
      - database
    restart: unless-stopped


volumes:
  database_data:
